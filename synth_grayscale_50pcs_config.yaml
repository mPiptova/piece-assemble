# Configuration for data/synth_grayscale_50pcs (one of the paper's 50-piece
# synthetic datasets, same cut geometry as synth_color_50pcs with color
# removed, jagged/torn cuts simulating a broken negative).
img_path: "data/synth_grayscale_50pcs"

# Logging settings, optional.
logging:
  output_images_path: "./output/puzzle/synth_grayscale_50pcs"
  store_new_matches: True
  store_old_matches: True
  store_trusted_clusters: True

piece:
  polygon_approximation_tolerance: 3
  sigma: 4
  scale: 0.5

descriptor:
  min_segment_len: 0
  n_points: 5
  n_colors: 7
  spatial_dist_w: 1
  color_dist_w: 11
  color_var_w: 0
  length_w: 110
  rel_len_diff_w: 5
  angle_w: 0
  tol_dists: [2, 3]

cluster:
  border_dist_tol: 4
  self_intersection_tol: 0.02
  rotation_tol: 0.17
  translation_tol: 30

cluster_scorer:
  w_convexity: 2
  w_complexity: 2
  w_color_dist: 1000
  w_dist: 50
  w_border_length: 0.1

trusted_cluster:
  complexity_threshold: 4
  color_threshold: 0.01
  dist_threshold: 1.15

clustering:
  n_new_matches: 30
  min_complexity: [0.5, 0.5]
  n_iters: 20
  icp_max_iters: 100
  icp_min_change: 0.3
  n_processes: 4
  n_used_matches: 40000
