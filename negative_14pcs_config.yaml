# Configuration for data/negative_14pcs, the real case-study dry-plate
# negative fragments (13 numbered pieces + "pannelli", the base panel they
# attach to).
img_path: "data/negative_14pcs"

# Logging settings, optional.
logging:
  output_images_path: "./output/puzzle/negative_14pcs"
  store_new_matches: True
  store_old_matches: True
  store_trusted_clusters: True

# Defines the parameters of the piece representation
piece:
  polygon_approximation_tolerance: 1
  sigma: 2
  # scale: 1 (no downscaling) is deliberate -- these are real, already-small
  # torn fragment photos (as small as ~90x75px natively), so further
  # downscaling would throw away detail that's already scarce, unlike
  # owl_101pcs/synth's much larger source photos.
  scale: 1

descriptor:
  min_segment_len: 0
  n_points: 5
  n_colors: 7
  spatial_dist_w: 1
  color_dist_w: 11
  color_var_w: 0
  length_w: 110
  rel_len_diff_w: 5
  angle_w: 0
  # [3, 2]: controls osculating-circle arc segmentation granularity. One
  # necessary bridging match on this dataset is not geometrically correct at
  # any candidate rank without this value (see docs/evaluation-report-draft.md,
  # parameter sensitivity).
  tol_dists: [3, 2]

cluster:
  border_dist_tol: 10
  self_intersection_tol: 0.06
  rotation_tol: 0.17
  # translation_tol: 150, much looser than the synthetic datasets' 30px --
  # calibrated to this dataset's own measured residual deformation (real,
  # physically warped fragments), not an arbitrary choice.
  translation_tol: 150

cluster_scorer:
  w_convexity: 0
  w_complexity: 2
  w_color_dist: 1000
  w_dist: 100
  w_border_length: 0.1

trusted_cluster:
  complexity_threshold: 4
  color_threshold: 0.01
  dist_threshold: 2

clustering:
  n_new_matches: 25
  min_complexity: [2, 0.15]
  n_iters: 8
  icp_max_iters: 100
  icp_min_change: 1
  n_processes: 2
  n_used_matches: 1500
