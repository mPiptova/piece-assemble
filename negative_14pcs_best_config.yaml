# Best validated config for data/negative_14pcs, found by iterative
# threshold/parameter search against the paper's claimed "12 of 14 pieces
# correctly reassembled" result (p10, p12 excluded -- structurally
# near-impossible: p12 has zero GT neighbors, p10 has only one).
#
# Validated across 18 independent, never-reused fresh seeds (301-308,
# 401-410): never below 11/14, reaches the full 12/14 in 8/18 (44%) of
# seeds. See memory piece-assemble-negative14-best-config.md for the full
# rationale behind each setting and what was tried and did NOT help
# (raising dist_threshold, lowering complexity_threshold, changing
# recycling_bridge_power, raising n_iters beyond 8, cycle_trust) -- and
# piece-assemble-negative14-seed-overfitting.md for why this needed
# validation on fresh seeds rather than the repeatedly-reused seeds 1-5
# (a config that looked PERFECTLY stable on those collapsed on fresh ones).
#
# Run with, e.g.:
#   python src/piece_assemble/tools/eval_assembly.py \
#     negative_14pcs_best_config.yaml <puzzle_list> data \
#     --repeats 10 --seed <N> --label <name> --output-dir <dir>
img_path: "/Users/marcela.brichtova-piptova/piece-assemble/data/negative_14pcs"

logging:
  output_images_path: "/Users/marcela.brichtova-piptova/piece-assemble/output/puzzle/negative_14pcs_best"
  store_new_matches: True
  store_old_matches: True
  store_trusted_clusters: True

cluster:
  border_dist_tol: 10
  self_intersection_tol: 0.06
  rotation_tol: 0.17
  translation_tol: 150

cluster_scorer:
  w_convexity: 0
  w_complexity: 2
  w_color_dist: 1000
  w_dist: 100
  w_border_length: 0.1

trusted_cluster:
  complexity_threshold: 4
  color_threshold: 0.01
  dist_threshold: 2

piece:
  polygon_approximation_tolerance: 1
  sigma: 2
  scale: 1

descriptor:
  min_segment_len: 0
  n_points: 5
  n_colors: 0
  spatial_dist_w: 1
  color_dist_w: 11
  color_var_w: 0
  length_w: 110
  rel_len_diff_w: 5
  angle_w: 0
  # [3, 2] instead of the baseline [2, 1]: controls osculating-circle arc
  # segmentation granularity. Without this change, the p13-p8 bridge match
  # (and others) is never geometrically correct at any rank, capping the
  # achievable ceiling below 12/14 regardless of clustering config.
  tol_dists: [3, 2]

clustering:
  n_new_matches: 25
  # Floor lowered from the baseline 0.5: several genuinely-correct bridge
  # matches (e.g. p3-p8 complexity 0.25) sit below the default floor and
  # get discarded outright, with no second chance, before ever being
  # remembered for later recycling.
  min_complexity: [2, 0.15]
  n_iters: 8
  icp_max_iters: 100
  icp_min_change: 1
  n_processes: 2
  n_used_matches: 5000
  score_based_admission: true
  use_redundant_match_trust: true
  # A piece like p11 has only one correct connection (p11-p5, complexity
  # 1.59) and it is verified only once across all its raw candidates --
  # it can never cross re_sighting_threshold regardless of value. Turning
  # this off lets more near-duplicate verified instances of a pair reach
  # the admission/dedup logic instead of being collapsed to a single
  # best-dist one before they're even counted.
  dedupe_pending_matches: false
