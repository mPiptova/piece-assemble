# Shared configuration for all three of the paper's 50-piece synthetic
# datasets (data/synth_color_50pcs, data/synth_grayscale_50pcs,
# data/synth_white_50pcs -- same cut geometry, differing only in how much
# color/texture information the rendered pieces carry). One file on purpose:
# synth_grayscale_50pcs_config.yaml and synth_white_50pcs_config.yaml used to
# carry different piece.scale/sigma/cluster.border_dist_tol/clustering.n_iters
# than this dataset's config, left over from sample_config.yaml's
# owl_101pcs-tuned defaults and never revisited when synth_color_50pcs was
# retuned -- an unintended confound when comparing results across the three.
# These parameters (sigma=3, scale=1, border_dist_tol=6, n_iters=10) are the
# ones proven on synth_color_50pcs (ratio=1.0 in 5/5 repeats); now applied
# identically to all three so the color/grayscale/white comparison is
# controlled.
#
# img_path below is only a default for a manual single-dataset run via
# run_assembly.py -- edit it to point at the dataset you want. The evaluation
# harness (eval_assembly.py) overrides img_path per puzzle itself and ignores
# this value.
img_path: "data/synth_color_50pcs"

# Logging settings, optional.
logging:
  output_images_path: "./output/puzzle/synth_50pcs"
  store_new_matches: True
  store_old_matches: True
  store_trusted_clusters: True

piece:
  polygon_approximation_tolerance: 3
  sigma: 3
  scale: 1

descriptor:
  min_segment_len: 0
  n_points: 5
  n_colors: 7
  spatial_dist_w: 1
  color_dist_w: 11
  color_var_w: 0
  length_w: 110
  rel_len_diff_w: 5
  angle_w: 0
  tol_dists: [2, 3]

cluster:
  border_dist_tol: 6
  self_intersection_tol: 0.02
  rotation_tol: 0.17
  translation_tol: 30

cluster_scorer:
  w_convexity: 2
  w_complexity: 2
  w_color_dist: 1000
  w_dist: 50
  w_border_length: 0.1

trusted_cluster:
  complexity_threshold: 4
  color_threshold: 0.01
  dist_threshold: 1.15

clustering:
  n_new_matches: 20
  min_complexity: [0.5, 0.5]
  n_iters: 10
  icp_max_iters: 100
  icp_min_change: 0.3
  n_processes: 4
  n_used_matches: 40000
