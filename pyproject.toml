[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "piece_assemble"
version = "0.1.0"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.isort]
profile = "black"
